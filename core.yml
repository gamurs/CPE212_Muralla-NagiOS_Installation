#      sudo dpkg -l selinux*
#    when: ansible_distribution == "Ubuntu"


- hosts: CentOS
  become: true
  roles:
    - centos_install
  tags: ["done"]

- hosts: Ubuntu
  become: true
  roles:
    - ubuntu_install
